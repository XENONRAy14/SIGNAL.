name: tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: signal, POSTGRES_PASSWORD: testpassword, POSTGRES_DB: signal}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U signal" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.lock
      - run: cd backend && pytest -q
      - run: cd backend && alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+psycopg://signal:testpassword@localhost:5432/signal
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run build && npm audit
